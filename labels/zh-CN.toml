# 文案表：面向使用者的教学文案都放这里，代码里只出现 key。
#
# 只放「用户看得见的教学文字」：学科名、学段名、阶段名、常用术语、演示数据提示语。
# CLI 日志与报错信息不进这张表。
# 想换成自己的说法：复制一份（例如 my-zh.toml）改内容，再用 config.toml 的
# [project] locale / labels_dir 指过去。
#
# 每一项都必须是字符串；嵌套表会拍平成 a.b.c 这样的 key。

[project]
default_name = "物理教学中枢"

[subjects]
