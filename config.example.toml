# 物理教学中枢 — 示例配置
#
# 用法：复制为 config.toml 后按自己的情况修改。
# config.toml 已在 .gitignore 中，不会进入 Git。
#
# 设计原则：引擎不绑定学段、学科、班级、学期与路径；这些都属于使用者本地配置。
# 字段总览与可覆盖的环境变量见 README 的「配置」小节。

[project]
name = "物理教学中枢"

# 学段：high_school（高中） | middle_school（初中）
# Phase 1 起，学段会决定阶段定义与文案取自哪一套 profile。
stage = "high_school"
subject = "physics"

# IANA 时区名；教学日与教学周都按这个时区计算。
timezone = "Asia/Shanghai"

# 文案表：locale 决定取 labels/<locale>.toml（仓库自带 zh-CN）。
# labels_dir 省略时用仓库自带的 labels/ 目录；写了就按本配置文件所在目录解析。
locale = "zh-CN"
# labels_dir = "labels"

[paths]
# 数据库与输出目录都在使用者的本地环境里，不入 Git。
# 相对路径以「本配置文件所在目录」为基准解析，与当前工作目录无关；~ 会展开为家目录。
database = "data/physics_teaching.db"
output_dir = "outputs"

[semester]
# 学期名会进报告文案；starts_on / ends_on 是必填的学期起止日期。
name = "2026-2027 学年第一学期"
starts_on = "2026-09-01"
ends_on = "2027-01-22"

[classes]
# 班级由使用者自行填写；下面的班名是虚构示例。
names = ["高一(A)班", "高一(B)班"]

[schedule]
# 课表起点；省略时取 semester.starts_on。这一周所在的周一算第 1 教学周（一周从周一开始）。
starts_on = "2026-09-01"

# 上课日：1=周一 … 7=周日；缺省为周一至周五。
weekdays = [1, 2, 3, 4, 5]

# 节次标签，供演示课表使用；留空表示由后续模块给默认值。
periods = ["第1节", "第2节", "第7节"]

# 教学阶段：整段不写，就按学段 profile 的默认阶段自动切分学期
# （初中与高中各有一套默认值，见 stage_profiles.py）。
# 想自己定就取消下面的注释；阶段要按时间排列、首尾相接、完整覆盖学期。
# [[phases]]
# name = "新授课"
# starts_on = "2026-09-01"
# ends_on = "2026-11-06"
#
# [[phases]]
# name = "一轮复习"
# starts_on = "2026-11-07"
# ends_on = "2026-12-25"
#
# [[phases]]
# name = "考前冲刺"
# starts_on = "2026-12-26"
# ends_on = "2027-01-22"
